name: Release BTST Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-btst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Inspect release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from github_release_assets import (
              get_release,
              list_release_assets,
          )

          owner = "myswingbtsttrading"
          repo = "nifty-options-btst"
          tag = "data-2017-v1"

          release = get_release(
              owner,
              repo,
              tag,
          )

          print("Release:")
          print(
              f"- tag: {release.get('tag_name')}"
          )
          print(
              f"- name: {release.get('name')}"
          )
          print(
              f"- id: {release.get('id')}"
          )

          assets = list_release_assets(
              owner,
              repo,
              tag,
          )

          print()
          print(
              f"Dedicated asset API count: "
              f"{len(assets)}"
          )

          for asset in assets:
              print(
                  f"- {asset.get('name')} "
                  f"({asset.get('size')} bytes) "
                  f"id={asset.get('id')}"
              )

          if not assets:
              raise SystemExit(
                  "ERROR: Dedicated GitHub release-assets "
                  "API returned zero assets."
              )
          PY

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          from github_release_assets import (
              download_release_assets,
          )

          paths = download_release_assets(
              owner="myswingbtsttrading",
              repo="nifty-options-btst",
              tag="data-2017-v1",
              asset_names=[
                  "NiftyOptions 2017.zip",
                  "NiftyOptions 2017091.zip",
              ],
              destination_dir=Path(
                  "release-data"
              ),
          )

          print("Downloaded release assets:")

          for path in paths:
              print(
                  f"- {path.name}: "
                  f"{path.stat().st_size} bytes"
              )
          PY

      - name: Run real Release BTST probe
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path

          from backtest_runner import (
              run_release_btst_probe,
          )

          result = run_release_btst_probe(
              release_dir=Path(
                  "release-data"
              ),
              year=2017,
              monthly_zip_name=(
                  "November 2017.zip"
              ),
              option_type="PE",
              strike=10050,
              entry_date=date(
                  2017,
                  10,
                  26,
              ),
              exit_date=date(
                  2017,
                  10,
                  27,
              ),
          )

          print("Release BTST probe")
          print("==================")
          print(
              f"Archive: "
              f"{result.get('archive')}"
          )
          print(
              f"Monthly ZIP: "
              f"{result.get('monthly_zip')}"
          )
          print(
              f"Option: "
              f"{result['option_type']}"
          )
          print(
              f"Strike: "
              f"{result['strike']}"
          )
          print(
              f"Entry: "
              f"{result['entry']}"
          )
          print(
              f"Exit: "
              f"{result['exit']}"
          )
          print("STATUS: PASS")
          PY