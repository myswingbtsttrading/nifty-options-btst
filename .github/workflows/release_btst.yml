name: Release BTST Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-btst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Download 2017 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-data

          gh release download data-2017-v1 \
            --repo myswingbtsttrading/nifty-options-btst \
            --pattern "October.2017.zip" \
            --dir release-data

          gh release download data-2017-v1 \
            --repo myswingbtsttrading/nifty-options-btst \
            --pattern "November.2017.zip" \
            --dir release-data

          echo "Downloaded release assets:"
          ls -lh release-data

      - name: Validate release ZIP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          release_dir = Path("release-data")

          expected = [
              "October.2017.zip",
              "November.2017.zip",
          ]

          for name in expected:
              path = release_dir / name

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: Missing release asset: {name}"
                  )

              size = path.stat().st_size

              print(
                  f"{name}: {size:,} bytes"
              )

              if size == 0:
                  raise SystemExit(
                      f"ERROR: Empty ZIP: {name}"
                  )

              with ZipFile(path) as archive:
                  bad_file = archive.testzip()

                  if bad_file is not None:
                      raise SystemExit(
                          f"ERROR: Corrupt ZIP "
                          f"{name}: {bad_file}"
                      )

                  print(
                      f"ZIP OK: "
                      f"{len(archive.namelist())} entries"
                  )

          print("STATUS: RELEASE ASSETS PASS")
          PY

      - name: Run Release BTST probe
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path

          from backtest_runner import (
              run_release_btst_probe,
          )

          result = run_release_btst_probe(
              release_dir=Path("release-data"),
              year=2017,
              monthly_zip_name="November.2017.zip",
              option_type="PE",
              strike=10050,
              entry_date=date(2017, 10, 26),
              exit_date=date(2017, 10, 27),
          )

          print("Release BTST probe")
          print("==================")
          print(
              f"Archive: "
              f"{result.get('archive')}"
          )
          print(
              f"Monthly ZIP: "
              f"{result.get('monthly_zip')}"
          )
          print(
              f"Option: "
              f"{result['option_type']}"
          )
          print(
              f"Strike: "
              f"{result['strike']}"
          )
          print(
              f"Entry: "
              f"{result['entry']}"
          )
          print(
              f"Exit: "
              f"{result['exit']}"
          )
          print("STATUS: PASS")
          PY