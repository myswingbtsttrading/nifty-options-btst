name: Release BTST Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-btst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          from github_release_assets import (
              download_release_assets,
          )

          paths = download_release_assets(
              owner="myswingbtsttrading",
              repo="nifty-options-btst",
              tag="data-2017-v1",
              asset_names=[
                  "NiftyOptions 2017.zip",
                  "NiftyOptions 2017091.zip",
              ],
              destination_dir=Path(
                  "release-data"
              ),
          )

          print("Downloaded release assets:")

          for path in paths:
              print(
                  f"- {path.name}: "
                  f"{path.stat().st_size} bytes"
              )
          PY

      - name: Validate downloaded ZIP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          release_dir = Path(
              "release-data"
          )

          expected = [
              "NiftyOptions 2017.zip",
              "NiftyOptions 2017091.zip",
          ]

          for name in expected:
              path = release_dir / name

              if not path.exists():
                  raise SystemExit(
                      f"Missing release asset: {name}"
                  )

              size = path.stat().st_size

              print(
                  f"{name}: {size} bytes"
              )

              if size == 0:
                  raise SystemExit(
                      f"Empty ZIP: {name}"
                  )

              with ZipFile(path) as archive:
                  bad = archive.testzip()

                  if bad is not None:
                      raise SystemExit(
                          f"Corrupt ZIP {name}: {bad}"
                      )

                  print(
                      f"  ZIP OK: "
                      f"{len(archive.namelist())} entries"
                  )

          print(
              "STATUS: RELEASE ASSETS PASS"
          )
          PY

      - name: Run Release BTST probe
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path

          from backtest_runner import (
              run_release_btst_probe,
          )

          result = run_release_btst_probe(
              release_dir=Path(
                  "release-data"
              ),
              year=2017,
              monthly_zip_name=(
                  "November 2017.zip"
              ),
              option_type="PE",
              strike=10050,
              entry_date=date(
                  2017,
                  10,
                  26,
              ),
              exit_date=date(
                  2017,
                  10,
                  27,
              ),
          )

          print(
              "Release BTST probe"
          )
          print(
              "=================="
          )
          print(
              f"Archive: "
              f"{result.get('archive')}"
          )
          print(
              f"Monthly ZIP: "
              f"{result.get('monthly_zip')}"
          )
          print(
              f"Option: "
              f"{result['option_type']}"
          )
          print(
              f"Strike: "
              f"{result['strike']}"
          )
          print(
              f"Entry: "
              f"{result['entry']}"
          )
          print(
              f"Exit: "
              f"{result['exit']}"
          )
          print(
              "STATUS: PASS"
          )
          PY