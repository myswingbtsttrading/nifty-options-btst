name: Release BTST Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-btst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Inspect GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import urllib.request

          owner = "myswingbtsttrading"
          repo = "nifty-options-btst"
          tag = "data-2017-v1"

          url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/releases/tags/{tag}"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": (
                      "Bearer "
                      + __import__("os").environ["GH_TOKEN"]
                  ),
                  "User-Agent": "nifty-options-btst",
              },
          )

          with urllib.request.urlopen(request) as response:
              release = json.loads(
                  response.read().decode("utf-8")
              )

          print("Release:", release["tag_name"])
          print("Assets:")

          for asset in release.get("assets", []):
              print(
                  f"- {asset['name']} "
                  f"({asset['size']} bytes)"
              )
          PY

      - name: Run real GitHub Release BTST probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path

          from release_btst_pipeline import (
              run_release_btst_pipeline,
          )

          result = run_release_btst_pipeline(
              destination_dir=Path("release-data"),
              monthly_zip_name="November 2017.zip",
              option_type="PE",
              strike=10050,
              entry_date=date(2017, 10, 26),
              exit_date=date(2017, 10, 27),
              owner="myswingbtsttrading",
              repo="nifty-options-btst",
              tag="data-2017-v1",
              asset_names=[
                  "NiftyOptions 2017.zip",
                  "NiftyOptions 2017091.zip",
              ],
          )

          print("Release BTST probe")
          print("==================")
          print(f"Archive: {result.get('archive')}")
          print(
              f"Monthly ZIP: "
              f"{result.get('monthly_zip')}"
          )
          print(
              f"Option: "
              f"{result['option_type']}"
          )
          print(
              f"Strike: "
              f"{result['strike']}"
          )
          print(
              f"Entry: "
              f"{result['entry']}"
          )
          print(
              f"Exit: "
              f"{result['exit']}"
          )
          print(
              f"Downloaded: "
              f"{result['downloaded_assets']}"
          )
          print("STATUS: PASS")
          PY