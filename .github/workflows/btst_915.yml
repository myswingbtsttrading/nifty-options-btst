name: NIFTY BTST 9:30 AM Exit

on:
  workflow_dispatch:

  schedule:
    # 09:30 IST = 04:00 UTC
    - cron: "0 4 * * 1-5"

permissions:
  contents: write

jobs:
  btst-exit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Generate 9:30 AM SELL alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode 930

      - name: Verify closed BTST state
        run: |
          STATE_FILE="data/live_btst_signal.json"
          EXIT_FILE="data/last_btst_exit.json"

          if [ -f "$STATE_FILE" ]; then
            echo "Active BTST position state remains:"
            cat "$STATE_FILE"
          else
            echo "Active BTST position state removed."
          fi

          if [ -f "$EXIT_FILE" ]; then
            echo "Latest BTST exit record:"
            cat "$EXIT_FILE"
          else
            echo "No BTST exit record created."
          fi

      - name: Validate exit record
        run: |
          EXIT_FILE="data/last_btst_exit.json"

          if [ ! -f "$EXIT_FILE" ]; then
            echo "No exit record created."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/last_btst_exit.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          required = {
              "status",
              "closed_at",
              "entry_timestamp",
              "exit_timestamp",
              "direction",
              "option_type",
              "strike",
              "expiry",
              "entry_price",
              "exit_price",
              "quantity",
              "lots",
              "pnl",
              "pnl_pct",
          }

          missing = sorted(required - payload.keys())

          if missing:
              raise SystemExit(
                  f"Invalid exit record. Missing fields: {missing}"
              )

          if payload["status"] != "CLOSED":
              raise SystemExit(
                  f"Invalid exit status: {payload['status']}"
              )

          if payload["option_type"] not in {"CE", "PE"}:
              raise SystemExit(
                  f"Invalid option type: {payload['option_type']}"
              )

          if float(payload["entry_price"]) <= 0:
              raise SystemExit("Invalid entry price")

          if float(payload["exit_price"]) <= 0:
              raise SystemExit("Invalid exit price")

          if int(payload["quantity"]) <= 0:
              raise SystemExit("Invalid quantity")

          if int(payload["lots"]) <= 0:
              raise SystemExit("Invalid lots")

          print("BTST exit record validation passed.")
          PY

      - name: Remove closed BTST position state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_FILE="data/live_btst_signal.json"
          EXIT_FILE="data/last_btst_exit.json"

          if [ -f "$STATE_FILE" ]; then
            echo "Active state still exists; not removing it."
          elif git ls-files --error-unmatch "$STATE_FILE" >/dev/null 2>&1; then
            echo "Staging removal of closed BTST state."
            git add -u -- "$STATE_FILE"
          fi

          if [ -f "$EXIT_FILE" ]; then
            git add -- "$EXIT_FILE"
          fi

          if git diff --cached --quiet; then
            echo "No BTST exit state changes to commit."
          else
            git commit -m "Persist BTST exit state"
            git push
          fi