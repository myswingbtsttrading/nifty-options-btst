name: Verify Release Assets

on:
  workflow_dispatch:

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Verify all 12 monthly release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          owner = "myswingbtsttrading"
          repo = "nifty-options-btst"
          tag = "data-2017-v1"

          expected = {
              "January.2017.zip",
              "February.2017.zip",
              "March.2017.zip",
              "April.2017.zip",
              "May.2017.zip",
              "June.2017.zip",
              "July.2017.zip",
              "August.2017.zip",
              "September.2017.zip",
              "October.2017.zip",
              "November.2017.zip",
              "December.2017.zip",
          }

          api_url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/releases/tags/{tag}"
          )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": (
                  f"Bearer {os.environ['GH_TOKEN']}"
              ),
              "User-Agent": "nifty-options-btst",
          }

          request = urllib.request.Request(
              api_url,
              headers=headers,
          )

          with urllib.request.urlopen(request) as response:
              release = json.loads(
                  response.read().decode("utf-8")
              )

          print("Release verification")
          print("====================")
          print(f"Tag: {release.get('tag_name')}")
          print(f"Name: {release.get('name')}")
          print(f"Release ID: {release.get('id')}")

          assets_url = release["assets_url"]

          assets_request = urllib.request.Request(
              assets_url,
              headers=headers,
          )

          with urllib.request.urlopen(
              assets_request
          ) as response:
              assets = json.loads(
                  response.read().decode("utf-8")
              )

          actual = {
              asset.get("name")
              for asset in assets
          }

          print()
          print(
              f"API asset count: {len(assets)}"
          )
          print()
          print("Release assets:")

          for asset in assets:
              print(
                  f"- {asset.get('name')} "
                  f"| size={asset.get('size')} bytes "
                  f"| id={asset.get('id')} "
                  f"| state={asset.get('state')}"
              )

          missing = expected - actual
          unexpected = actual - expected

          print()

          if missing:
              print("Missing assets:")
              for name in sorted(missing):
                  print(f"- {name}")

              raise SystemExit(
                  "ERROR: Required release assets are missing."
              )

          if unexpected:
              print("Unexpected assets:")
              for name in sorted(unexpected):
                  print(f"- {name}")

          if len(assets) != 12:
              raise SystemExit(
                  f"ERROR: Expected 12 release assets, "
                  f"but API returned {len(assets)}."
              )

          if any(
              asset.get("state") != "uploaded"
              for asset in assets
          ):
              raise SystemExit(
                  "ERROR: One or more release assets "
                  "are not in uploaded state."
              )

          print()
          print("STATUS: PASS")
          print(
              "All 12 monthly 2017 release assets "
              "are visible through the GitHub "
              "release API."
          )
          PY