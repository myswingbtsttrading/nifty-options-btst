name: NIFTY BTST 3PM Signal

on:
  workflow_dispatch:

  schedule:
    # 15:00 IST = 09:30 UTC
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  btst-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Generate 3 PM BTST signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode 3pm

      - name: Persist BTST position state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_FILE="data/live_btst_signal.json"

          if [ -f "$STATE_FILE" ]; then
            echo "BTST state file exists. Staging new/updated position state."
            git add "$STATE_FILE"

          elif git ls-files --error-unmatch "$STATE_FILE" >/dev/null 2>&1; then
            echo "BTST state file was removed because there is no active BUY."
            git add -u -- "$STATE_FILE"

          else
            echo "No BTST position state exists. Nothing to persist."
          fi

          if git diff --cached --quiet; then
            echo "No BTST state changes to commit."
          else
            git commit -m "Persist BTST position state"
            git push
          fi