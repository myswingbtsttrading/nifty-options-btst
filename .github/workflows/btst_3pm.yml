name: NIFTY BTST 3PM Signal

on:
  workflow_dispatch:

  schedule:
    # 15:00 IST = 09:30 UTC
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty-btst-3pm
  cancel-in-progress: false

jobs:
  btst-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

      - name: Generate 3 PM BTST signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode 3pm

      - name: Verify BTST state output
        run: |
          STATE_FILE="data/live_btst_signal.json"
          EXIT_FILE="data/last_btst_exit.json"

          if [ -f "$STATE_FILE" ]; then
            echo "Active BTST position state exists:"
            cat "$STATE_FILE"
          else
            echo "No active BTST position state."
          fi

          if [ -f "$EXIT_FILE" ]; then
            echo "Latest BTST exit record:"
            cat "$EXIT_FILE"
          fi

      - name: Validate active BTST state
        run: |
          STATE_FILE="data/live_btst_signal.json"

          if [ ! -f "$STATE_FILE" ]; then
            echo "No active BUY position. Nothing to validate."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/live_btst_signal.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          required = {
              "timestamp",
              "decision",
              "direction",
              "expiry",
              "strike",
              "option_type",
              "entry_price",
              "quantity",
              "lots",
          }

          missing = sorted(required - payload.keys())

          if missing:
              raise SystemExit(
                  f"Invalid BTST state. Missing fields: {missing}"
              )

          if payload["decision"] != "BUY":
              raise SystemExit(
                  f"Invalid BTST state decision: {payload['decision']}"
              )

          if payload["option_type"] not in {"CE", "PE"}:
              raise SystemExit(
                  f"Invalid option type: {payload['option_type']}"
              )

          if float(payload["entry_price"]) <= 0:
              raise SystemExit("Invalid entry price")

          if int(payload["quantity"]) <= 0:
              raise SystemExit("Invalid quantity")

          if int(payload["lots"]) <= 0:
              raise SystemExit("Invalid lots")

          print("BTST state validation passed.")
          PY

      - name: Persist BTST position state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_FILE="data/live_btst_signal.json"

          if [ -f "$STATE_FILE" ]; then
            echo "BTST state file exists. Staging it."
            git add -- "$STATE_FILE"

          elif git ls-files --error-unmatch "$STATE_FILE" >/dev/null 2>&1; then
            echo "BTST state file was removed because there is no active BUY."
            git add -u -- "$STATE_FILE"

          else
            echo "No BTST state file exists. Nothing to persist."
          fi

          if git diff --cached --quiet; then
            echo "No BTST state changes to commit."
          else
            git commit -m "Persist BTST position state"
            git push
          fi